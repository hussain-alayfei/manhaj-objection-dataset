[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "manhaj-objection-dataset"
version = "0.1.0"
description = "Traceable Arabic methodology dataset and human review workbench"
requires-python = ">=3.12"
dependencies = ["fastapi==0.142.2", "uvicorn==0.54.0", "sqlalchemy==2.1.3", "psycopg[binary]==3.3.6", "pgvector==0.5.0", "pydantic==2.13.5", "pdfplumber==0.11.9", "pypdf==6.10.0", "httpx==0.28.1", "jsonschema==4.26.0", "python-multipart==0.0.32", "beautifulsoup4==4.15.0", "python-dotenv==1.2.4", "openai==3.24.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
semantic = ["sentence-transformers>=3,<6"]

[project.scripts]
manhaj = "src.cli:main"

[tool.vercel]
# Vercel loads the FastAPI instance named `app` from src/asgi.py.
entrypoint = "src.asgi:app"

[tool.vercel.fastapi.static]
# Serve web/ from Vercel's CDN (vercel.json adds nosniff and long-lived caching; JS/CSS URLs are content-hashed).
cdn = true

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

